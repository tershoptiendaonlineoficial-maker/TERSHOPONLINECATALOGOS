
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090b">
<meta name="description" content="Explora los catálogos de TERSHOP ONLINE.">
<title>Catálogos | TERSHOP ONLINE</title>

<style>
:root {
  --red: #ef382d;
  --red2: #ff594e;
  --ink: #08090b;
  --panel: rgba(12,13,16,.88);
  --line: rgba(255,255,255,.13);
  --muted: #b6b6bb;
  --white: #f7f7f8;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  color: var(--white);
  font-family: Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  background: #08090b url('fondo-tela-negra.webp') center top/cover fixed no-repeat;
  min-height: 100vh;
}

body:before {
  content: "";
  position: fixed;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(0,0,0,.68),
    rgba(0,0,0,.84) 45%,
    rgba(0,0,0,.92)
  );
  z-index: -1;
}

input {
  font: inherit;
}

.wrap {
  width: min(1180px,calc(100% - 32px));
  margin: auto;
}

header {
  padding: 22px 0 10px;
  text-align: center;
}

.logo {
  width: min(190px,46vw);
  height: auto;
  display: block;
  margin: 0 auto 8px;
  filter: drop-shadow(0 8px 22px #000);
}

.kicker {
  font-size: .72rem;
  letter-spacing: .28em;
  color: #ff6258;
  text-transform: uppercase;
  font-weight: 800;
}

h1 {
  font-size: clamp(1.8rem,4vw,3rem);
  margin: 9px 0 8px;
  letter-spacing: .04em;
  text-transform: uppercase;
}

.sub {
  color: #c7c7ca;
  margin: 0 auto;
  max-width: 650px;
  line-height: 1.6;
}

main {
  padding: 24px 0 60px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  backdrop-filter: blur(12px);
  box-shadow: 0 18px 55px #0008;
}

.toolbar {
  padding: 18px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  margin-bottom: 18px;
}

.searchbox {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #17181c;
  border: 1px solid #38393f;
  border-radius: 12px;
  padding: 0 14px;
  min-height: 48px;
}

.searchbox input {
  width: 100%;
  background: transparent;
  border: 0;
  outline: 0;
  color: white;
  padding: 13px 0;
}

.searchbox input::placeholder {
  color: #999;
}

.count {
  font-size: .85rem;
  color: var(--muted);
  white-space: nowrap;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 12px;
  margin: 28px 2px 13px;
}

.section-head h2 {
  font-size: 1.12rem;
  margin: 0;
  text-transform: uppercase;
  letter-spacing: .08em;
}

.section-head p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: .86rem;
}

.catalog-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(205px,1fr));
  gap: 12px;
}

.catalog-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  padding: 16px 15px;
  color: #fff;
  background: linear-gradient(135deg,#191a1f,#0c0d10);
  border: 1px solid #393a40;
  border-radius: 14px;
  cursor: pointer;
  transition: .2s;
  min-height: 76px;
  text-decoration: none;
}

.catalog-btn:hover {
  border-color: var(--red);
  background: linear-gradient(135deg,#321411,#121215);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px #e9342b24;
}

.catalog-icon {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: #ef382d1b;
  color: #ff6258;
  font-size: 1.25rem;
  flex: none;
}

.catalog-name {
  font-weight: 750;
  font-size: .94rem;
  line-height: 1.25;
}

.catalog-small {
  display: block;
  color: #aaa;
  font-size: .72rem;
  font-weight: 500;
  margin-top: 4px;
}

.empty {
  padding: 38px 16px;
  text-align: center;
  color: #bcbcc2;
  border: 1px dashed #484950;
  border-radius: 14px;
  grid-column: 1/-1;
}

footer {
  text-align: center;
  color: #999;
  font-size: .78rem;
  padding: 26px 10px 34px;
}

footer strong {
  color: #eee;
}

@media(max-width:650px) {
  .wrap {
    width: min(100% - 22px,1180px);
  }

  .toolbar {
    grid-template-columns: 1fr;
  }

  .catalog-grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 9px;
  }

  .catalog-btn {
    padding: 12px 10px;
    min-height: 70px;
    gap: 8px;
  }

  .catalog-icon {
    width: 34px;
    height: 34px;
  }

  .catalog-name {
    font-size: .8rem;
  }
}
</style>
</head>

<body>

<header class="wrap">
  <img
    class="logo"
    src="logo-tershop.webp"
    alt="TERSHOP TIENDA ONLINE"
  >

  <div class="kicker">Colección de diseños</div>

  <h1>Explora nuestros catálogos</h1>

  <p class="sub">
    Encuentra tu diseño favorito y accede directamente
    a nuestros catálogos en Google Drive.
  </p>
</header>

<main class="wrap">

  <section class="panel toolbar">

    <label class="searchbox">
      <span aria-hidden="true">⌕</span>

      <input
        id="search"
        type="search"
        placeholder="Buscar un catálogo..."
        autocomplete="off"
      >
    </label>

    <div class="count" id="catalogCount">
      17 catálogos disponibles
    </div>

  </section>

  <div class="section-head">
    <div>
      <h2>Selecciona un catálogo</h2>
      <p>Ordenados alfabéticamente</p>
    </div>
  </div>

  <section
    id="catalogGrid"
    class="catalog-grid"
    aria-label="Catálogos"
  ></section>

</main>

<footer class="wrap">
  © <span id="year"></span>
  <strong>TERSHOP ONLINE</strong>
  · Catálogo digital de diseños
</footer>

<script>

// CATÁLOGOS DE TERSHOP ONLINE

const CATALOGS = [

  {
    name: "Catálogo Aura",
    id: "1bY1XnP1NST4_-d4TpKDF08x5V7jsDhQu"
  },

  {
    name: "Catálogo Caballero",
    id: "1hFWBYi8MAR9h73q4A1H7fNEzx3s7eIRA"
  },

  {
    name: "Catálogo Carnaval",
    id: "1fzAeOCW_nY77IsZhLjxecKxtcrS-UaXY"
  },

  {
    name: "Catálogo Chucherías Venezolanas",
    id: "1hmXEQyeoknsnEQwr7H45pelgD-pEfGLl"
  },

  {
    name: "Catálogo Día de las Madres",
    id: "15yex68AkWUwhT9eLZrFXk5OUe8zLFnQB"
  },

  {
    name: "Catálogo Día del Maestro",
    id: "13F5O3k8XKWV-Ygg-_jKosCxniWmMfofa"
  },

  {
    name: "Catálogo Día del Padre",
    id: "1W1f9ur0bLn3RhoaDuD_FjXgEZqyym8U7"
  },

  {
    name: "Catálogo Divina Pastora",
    id: "1G29ro1aqsH1YGFKuGBexJmkbkC2PN4hU"
  },

  {
    name: "Catálogo Halloween",
    id: "1q-yT_-V9ShTO5mCcZIRC7_Q3_QwRGRaw"
  },

  {
    name: "Catálogo José Gregorio Hernández",
    id: "1MEiq4PJVCjSlqnMmhs7r5KBj9BVVPeBc"
  },

  {
    name: "Catálogo Navidad",
    id: "1nhu0DZK9a9mahTHe4jP5PqfZbzRsusPT"
  },

  {
    name: "Catálogo para Niños",
    id: "17cY6Xln0QZBO05znJA2K5czeP5wzKsOq"
  },

  {
    name: "Catálogo Religioso",
    id: "1DTh1zJsbfnytnrNDRY8MSOag_7Rp-EFX"
  },

  {
    name: "Catálogo San Miguel",
    id: "1Antj3zkczws1WLx2csczq9n1T8POl7_O"
  },

  {
    name: "Catálogo Semana Santa",
    id: "1BwUCiVlfmbGpN0gEGZFRi0bIgvzMHzh8"
  },

  {
    name: "Catálogo Vinotinto",
    id: "1_DdQ7qhkZWmJeojp2F4kPpuHdO44Quo8"
  },

  {
    name: "Catálogo Virgen del Valle",
    id: "16aw8fvFGbrCqPllhhAFu9l7SrOBbDAQE"
  }

];

// NORMALIZAR TEXTO PARA EL BUSCADOR

function normalize(text) {
  return (text || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

// CONSTRUIR ENLACE DE GOOGLE DRIVE

function folderUrl(id) {
  return `https://drive.google.com/drive/folders/${id}?usp=sharing`;
}

// MOSTRAR CATÁLOGOS

function renderCatalogs() {

  const search = document.getElementById("search");

  const grid = document.getElementById("catalogGrid");

  const count = document.getElementById("catalogCount");

  const query = normalize(search.value);

  const filtered = CATALOGS.filter(catalog =>
    normalize(catalog.name).includes(query)
  );

  count.textContent =
    `${filtered.length} de ${CATALOGS.length} catálogos`;

  grid.innerHTML = "";

  filtered.forEach(catalog => {

    const link = document.createElement("a");

    link.className = "catalog-btn";

    link.href = folderUrl(catalog.id);

    link.target = "_blank";

    link.rel = "noopener noreferrer";

    link.innerHTML = `
      <span class="catalog-icon">▤</span>

      <span class="catalog-name">
        ${catalog.name}

        <span class="catalog-small">
          Abrir diseños en Drive →
        </span>
      </span>
    `;

    grid.appendChild(link);

  });

  if (filtered.length === 0) {

    grid.innerHTML = `
      <div class="empty">
        No encontramos catálogos con ese nombre.
      </div>
    `;

  }

}

// BUSCADOR

document
  .getElementById("search")
  .addEventListener("input", renderCatalogs);

// AÑO AUTOMÁTICO

document.getElementById("year").textContent =
  new Date().getFullYear();

// INICIAR CATÁLOGO

renderCatalogs();

</script>

</body>
</html>
